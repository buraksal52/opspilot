[project]
name = "opspilot-api"
version = "0.1.0"
description = "OpsPilot backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
    "redis>=5.2",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    # PDF text extraction for document ingestion (Phase 3, RAG_SYSTEM.md §6).
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    # Used only by scripts/northstar (Phase 2 dataset generator) to render the
    # demo business documents as PDF (DATASET.md §19). Not an API runtime
    # dependency: the Dockerfile's `pip install .` never pulls dev extras, so
    # this never ships in the deployed API image (ADR-023).
    "fpdf2>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
